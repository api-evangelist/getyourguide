notes: >-
  Cross-cutting request/response semantics for the GetYourGuide Partner API,
  derived from the published OpenAPI (github.com/getyourguide/partner-api-spec)
  and its wiki. Cross-links authentication/, errors/, and lifecycle/.
authentication:
  style: api-key
  location: header
  parameter: X-ACCESS-TOKEN
  transport: TLS (HTTPS only)
  ref: authentication/getyourguide-authentication.yml
versioning:
  style: uri-path-parameter
  detail: >-
    Every resource path carries a {version} path parameter (e.g.
    /1/tours, /1/bookings). The version is supplied by the client on each call.
  ref: lifecycle/getyourguide-lifecycle.yml
pagination:
  style: offset-limit
  request_params:
  - limit
  - offset
  response_fields:
  - _metadata.totalCount
  - _metadata.limit
  - _metadata.offset
  detail: >-
    List endpoints (e.g. GET /{version}/tours) accept limit and offset query
    parameters; the _metadata envelope returns totalCount, limit, and offset.
response_envelope:
  shape: metadata-and-data
  fields:
  - _metadata
  - data
  detail: >-
    Successful responses wrap results in an object with a _metadata block
    (descriptor, date, status, query, totalCount, limit, offset,
    availableLanguages) and a data block carrying the resource payload.
error_envelope:
  shape: custom
  format: not-rfc9457
  fields:
  - descriptor
  - apiVersion
  - method
  - date
  - status
  - query
  - errors
  - helpURL
  detail: >-
    Errors return a custom JSON envelope with an errors[] array of
    {errorCode (GetYourGuide internal integer), errorMessage}. Not RFC 9457
