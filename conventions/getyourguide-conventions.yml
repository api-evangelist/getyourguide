  ref: errors/getyourguide-problem-types.yml
localization:
  currency_param: currency
  language_param: cnt_language
  detail: >-
    Requests accept currency and cnt_language query parameters; responses
    surface availableLanguages in _metadata.
idempotency:
  supported: false
  detail: >-
    The Partner API does not document an idempotency-key header or parameter.
    The booking flow is instead made safe by a two-step cart/confirm model
    (POST /{version}/bookings creates or adds to a cart, POST /{version}/carts
    confirms it) with server-issued booking_hash and shopping_cart_hash
    identifiers used to reference and cancel bookings.
rate_limiting:
  documented: false
  detail: No rate-limit headers or quotas are declared in the OpenAPI spec.
