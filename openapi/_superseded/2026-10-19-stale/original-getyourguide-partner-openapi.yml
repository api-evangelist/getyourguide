          type: array
          items:
            $ref: '#/components/schemas/Durations'
        opening_hours:
          description: A list of opening hours for a given attraction or venue in local time.
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/OpeningHours'
        cancellation_policy:
          $ref: '#/components/schemas/CancellationPolicy'
        cancellation_policy_text:
          $ref: '#/components/schemas/CancellationPolicyText'
        itineraries:
          type: array
          nullable: true
          description: Structured itinerary describing the ordered stops/days of the tour. May be null or empty for tours without structured itinerary data.
          items:
            $ref: '#/components/schemas/Itinerary'
    IntegerRange:
      type: object
      properties:
        min:
          type: integer
          description: Minimum value of the range.
          example: 1
        max:
          type: integer
          description: Maximum value of the range.
          example: 20
    ParticipantCategory:
      type: object
      required:
        - ticket_category
        - name
      properties:
        ticket_category:
          type: string
          example: adult
          description: |
            Possible values:
            - infant
            - child
            - youth
            - student
            - eu_citizen_student
            - adult
            - eu_citizen
            - military
            - senior
            - group
        name:
          type: string
          example: Adults
        age_range:
          $ref: '#/components/schemas/IntegerRange'
        independently_bookable:
          description: Only relevant for non-group categories
          type: boolean
          example: true
    AvailableAddon:
      type: object
      required:
        - id
        - name
        - max_quantity
      properties:
        id:
          type: integer
          example: 1934
        name:
          type: string
          example: Free drinks
        max_quantity:
          type: integer
          example: 10
    AvailableDate:
      type: object
      required:
        - date
        - has_deal
      properties:
        date:
          type: string
          format: date
        has_deal:
          description: Flag that indicates whether there is a special offer for this date.
          type: boolean
          example: true
    Availability:
      description: Availability by tour.
      type: object
      required:
        - tour_id
        - participants_range
        - categories
        - available_dates
        - update_timestamp
      properties:
        tour_id:
          $ref: '#/components/schemas/TourId'
        participants_range:
          $ref: '#/components/schemas/IntegerRange'
        categories:
          description: List of tour categories available to book.
          type: array
          items:
            $ref: '#/components/schemas/ParticipantCategory'
        addons:
          description: List of addons available to book within a tour (not necessarily present in all the tour-options within a tour).
          type: array
          items:
            $ref: '#/components/schemas/AvailableAddon'
        available_dates:
          description: List of available dates to book for this tour.
          type: array
          items:
            $ref: '#/components/schemas/AvailableDate'
        update_timestamp:
          description: The timestamp of the last update to the available entity (in UTC).
          type: string
          format: date-time
          example: '2023-01-23T04:56:07'
    Date:
      description: The local date format `Y-m-d`.
      example: '2023-09-01'
      format: date
      type: string
    DayBreakdownRequest:
      type: object
      required:
        - base_data
        - data
      properties:
        base_data:
          type: object
          required:
            - currency
          properties:
            currency:
              $ref: '#/components/schemas/Currency'
        data:
          type: object
          required:
            - date
            - participants
          properties:
            date:
              $ref: '#/components/schemas/Date'
            participants:
              type: object
              additionalProperties:
                type: integer
              description: |
                The key here is a ticket category, and the value is the number of participants. Possible keys:
                - adult
                - child
                - youth
                - infant
                - senior
                - student
                - eu_citizen
                - military
                - eu_citizen_student
              example:
                adult: 10
            addons:
              type: array
              items:
                type: object
                required:
                  - id
                  - quantity
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 9291
                  quantity:
                    type: integer
                    description: Number of addons to calculate price.
                    example: 10
    OpeningHour:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          example: '14:00'
        to:
          type: string
          example: '18:00'
    UnavailabilityReason:
      type: object
      required:
        - reason_group
      properties:
        reason_group:
          type: string
          example: not_enough_spots
          description: |
            Possible values:
            - no_availability
            - not_enough_spots
            - invalid_request
            - others
    Price:
      type: object
      required:
        - retail_price
        - currency
      properties:
        customer_base_price:
          type: number
          example: 45
          description: The price for which the tour option category is sold to the customer excluding discounts if any.
        retail_price:
          type: number
          example: 40
          description: The price for which the tour option category is sold to the customer.
        currency:
          type: string
          description: ISO 4217, The currency with which you would like to pay.
          example: USD
    LocalDateRange:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
    DealInformation:
      type: object
      required:
        - date_range
      properties:
        deal_percentage:
          type: number
          format: float
          description: Percentage of the applied deal.
          example: 20
        deal_booked_vacancies:
          type: integer
          description: Number of seats of the order to which the deal has been applied.
          example: 5
        date_range:
          $ref: '#/components/schemas/LocalDateRange'
    IndividualCategoryPriceBreakdown:
      type: object
      required:
        - category_id
        - ticket_category
        - quantity
        - price
      properties:
        category_id:
          type: integer
          format: int64
          description: The value to use when adding the individual participants to the booking.
          example: 1
        quantity:
          type: integer
          description: Number of individual/group participants, or addon items.
          example: 5
        price:
          $ref: '#/components/schemas/Price'
        ticket_category:
          type: string
          description: |
            Possible values:
            - adult
            - child
            - youth
            - infant
            - senior
            - student
            - eu_citizen
            - military
            - eu_citizen_student
          example: adult
        min_age:
          type: integer
          description: Minimum age of participant.
          example: 16
        max_age:
          type: integer
          description: Maximum age of participant.
          example: 64
        independently_bookable:
          type: boolean
          description: Whether or not the category can be booked on its own.
        deal_information:
          $ref: '#/components/schemas/DealInformation'
    GroupBreakdown:
      type: object
      required:
        - max_group_size
        - quantity
        - price
      properties:
        quantity:
          type: integer
          description: Number of individual/group participants, or addon items.
          example: 5
        price:
          $ref: '#/components/schemas/Price'
        max_group_size:
          type: integer
          description: Maximum number of participants, including additional participants.
          example: 10
        deal_information:
          $ref: '#/components/schemas/DealInformation'
    AdditionalPaxBreakdown:
      type: object
      required:
        - max_group_size
        - quantity
        - price
      properties:
        quantity:
          type: integer
          description: Number of individual/group participants, or addon items.
          example: 5
        price:
          $ref: '#/components/schemas/Price'
        deal_information:
          $ref: '#/components/schemas/DealInformation'
    GroupPriceBreakdown:
      type: object
      required:
        - category_id
        - group_breakdown
      properties:
        category_id:
          type: integer
          description: The value to use when adding the group participants to the booking.
          format: int64
          example: 1
        group_breakdown:
          $ref: '#/components/schemas/GroupBreakdown'
        additional_pax_breakdown:
          $ref: '#/components/schemas/AdditionalPaxBreakdown'
    AddonPriceBreakdown:
      type: object
      required:
        - category_id
        - quantity
        - price
      properties:
        category_id:
          type: integer
          description: The value to use when adding the addon to the booking.
          format: int64
          example: 1241
        quantity:
          type: integer
          description: Number of individual/group participants, or addon items.
          example: 5
        price:
          $ref: '#/components/schemas/Price'
    DealSummary:
      type: object
      required:
        - original_price
        - currency
        - percentage
        - date_range
      properties:
        original_price:
          type: number
          example: 50
          description: The price for which the tour option was sold to the customer (without discount).
        currency:
          type: string
          description: ISO 4217, The currency with which you would like to pay.
          example: USD
        percentage:
          type: number
          format: float
          example: 20
        date_range:
          $ref: '#/components/schemas/LocalDateRange'
    PriceSummary:
      type: object
      required:
        - retail_price
        - currency
      properties:
        retail_price:
          type: number
          example: 50
          description: The price for which the tour option was sold to the customer.
        currency:
          type: string
          description: ISO 4217, The currency with which you would like to pay.
          example: USD
    PriceBreakdown:
      type: object
      required:
        - price_summary
      properties:
        individuals:
          type: array
          items:
            $ref: '#/components/schemas/IndividualCategoryPriceBreakdown'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupPriceBreakdown'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/AddonPriceBreakdown'
        deal_summary:
          $ref: '#/components/schemas/DealSummary'
        price_summary:
          $ref: '#/components/schemas/PriceSummary'
    TimeSlot:
      type: object
      required:
        - date_time
        - vacancies
      properties:
        date_time:
          type: string
          example: '2023-03-01T00:00:00'
          description: Tour-option conduction date, it will be midnight of the conduction date if the activity uses opening hours format `Y-m-d T H:i:s`.
        vacancies:
          type: integer
          example: 10
        unavailability_reason:
          $ref: '#/components/schemas/UnavailabilityReason'
        price_breakdown:
          $ref: '#/components/schemas/PriceBreakdown'
    Option:
      type: object
      required:
        - option_id
        - time_slots
      properties:
        option_id:
          type: integer
          format: int64
          example: 1231
        next_available_date:
          type: string
          format: date
          description: Next available date for the option, in case no timeslots could be found for a given date and participants.
        opening_hours:
          description: This field is show if the given product does not offer fixed time slots, but has opening hours for which a ticket will be valid.
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/OpeningHour'
        time_slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlot'
  parameters:
    version:
      in: path
      name: version
      required: true
      schema:
        $ref: '#/components/schemas/Version'
    cntLanguage:
      in: query
      name: cnt_language
      required: true
      schema:
        $ref: '#/components/schemas/CntLanguage'
    currency:
      description: ISO 4217, The currency with which you would like to pay.
      in: query
      name: currency
      example: USD
      required: true
      schema:
        $ref: '#/components/schemas/Currency'
    country:
      description: ISO 3166-1, The country where to payment originates. Should be the same value as the country_code field of the Billing Address Object.
      in: query
      name: country
      example: US
      required: true
      schema:
        $ref: '#/components/schemas/Country'
    bookingHash:
      in: path
      name: booking_hash
      required: true
      schema:
        $ref: '#/components/schemas/BookingHash'
    shoppingCartHash:
      in: path
      name: shopping_cart_hash
      required: true
      schema:
        $ref: '#/components/schemas/ShoppingCartHash'
    limit:
      in: query
      name: limit
      required: false
      schema:
        $ref: '#/components/schemas/Limit'
    offset:
      in: query
      name: offset
      required: false
      schema:
        $ref: '#/components/schemas/Offset'
    categoryId:
      in: path
      name: category_id
      required: true
      schema:
        $ref: '#/components/schemas/CategoryId'
    optionId:
      in: path
      name: option_id
      required: true
      schema:
        $ref: '#/components/schemas/OptionId'
    dates:
      allowReserved: true
      description: Check for tours that are offered on date or between dates.
      examples:
        multipleDates:
          summary: Date from, Date to
          value:
            - '2021-05-01T00:00:00'
            - '2021-05-01T23:59:59'
        singleDate:
          summary: Date from
          value:
            - '2021-05-01T00:00:00'
      explode: true
      in: query
      name: date[]
      required: false
      schema:
        items:
          $ref: '#/components/schemas/Datetime'
        type: array
    tourId:
      in: path
      name: tour_id
      required: true
      schema:
        $ref: '#/components/schemas/TourId'
    date:
      description: Defines the date of the oldest review that should be returned.
      in: query
      name: date
      required: false
      schema:
        $ref: '#/components/schemas/Datetime'
    sortfield:
      description: Defines the sort field.
      in: query
      name: sortfield
      required: false
      schema:
        enum:
          - rating
          - date
        type: string
    sortdirection:
      description: Defines the sort order. Ignored when `sortfield=popularity`.
      in: query
      name: sortdirection
      required: false
      schema:
        enum:
          - DESC
          - ASC
        type: string
    limit-2:
      description: Number of reviews to retrieve. Maximum value for this endpoint is 50.
      in: query
      name: limit
      required: false
      schema:
        $ref: '#/components/schemas/Limit-2'
    offset-2:
      description: Defines the offset of the first review that should be returned. Currently limited to 300.
      in: query
      name: offset
      required: false
      schema:
        $ref: '#/components/schemas/Offset-2'
    supplierId:
      in: path
      name: supplier_id
      required: true
      schema:
        $ref: '#/components/schemas/SupplierId'
    preformatted:
      description: The amount of content to deliver with the search results.
      examples:
        full:
          summary: Include a full description
          value: full
        home:
          summary: Include a composition of information
          value: home
        teaser:
          summary: Include title and an abstract
          value: teaser
      in: query
      name: preformatted
      required: false
      schema:
        type: string
    q:
      description: 'Mutually exclusive with ''coordinates'' parameter! Query string, can be location name or IATA code. For IATA the query parameter looks like this: ''q=iata:jfk'''
      examples:
        search_by_IATA:
          summary: Search by IATA airport codes.
          value: iata:jfk
        search_by_query:
          summary: Search by standard query.
          value: Berlin
      in: query
      name: q
      required: false
      schema:
        type: string
    coordinates:
      allowReserved: true
      description: Mutually exclusive with 'q' parameter! Search by latitude, longitude and radius passed as URL array.'
      examples:
        allCoordinates:
          summary: Latitude, longitude, radius
          value:
            - 48.85693
            - 2.3412
            - 10
      explode: true
      in: query
      name: coordinates[]
      required: false
      schema:
        items:
          type: number
        type: array
    condLanguages:
      allowReserved: true
      description: The conduction language(s) of a tour. When given, the results contain only tours that are available in the specified language(s).
      examples:
        multipleIds:
          summary: Example of a multiple languages
          value:
            - de
            - en
        oneId:
          summary: Example of a single language
          value:
            - en
      explode: true
      in: query
      name: cond_language[]
      required: false
      schema:
        items:
          $ref: '#/components/schemas/Language'
        type: array
    prices:
      allowReserved: true
      description: Filter for price in the query.
      examples:
        multipleIds:
          summary: Example of a min / max
          value:
            - 100
            - 200
        oneId:
          summary: Example of a max price
          value:
            - 200
      explode: true
      in: query
      name: price[]
      required: false
      schema:
        items:
          $ref: '#/components/schemas/PriceField'
        type: array
    categories:
      allowReserved: true
      description: Filter for categories for a given query via 'q' or 'coordinates', also works stand-alone as the main query parameter.
      examples:
        multipleIds:
          summary: Example of multiple categories
          value:
            - 55
            - 56
        oneId:
          summary: Example of a single category
          value:
            - 55
      explode: true
      in: query
      name: categories[]
      required: false
      schema:
        items:
          $ref: '#/components/schemas/CategoryId'
        type: array
    ratings:
      allowReserved: true
      description: Filter for Tours with the given ratings. Single value min rating. Otherwise [min, max].
      examples:
        multipleRating:
          summary: Example of min/max rating.
          value:
            - 2
            - 5
        singleRating:
          summary: Example of a min rating.
          value:
            - 4
      explode: true
      in: query
      name: rating[]
      required: false
      schema:
        items:
          $ref: '#/components/schemas/Rating'
        type: array
    durations:
      allowReserved: true
      description: Filter for min and/or max duration in minutes. Single Value max. duration. Otherwise [min, max].
      examples:
        multipleIds:
          summary: Example of a min / max
          value:
            - 1
            - 3
        oneId:
          summary: Example of a max duration
          value:
            - 3
      explode: true
      in: query
      name: duration[]
      required: false
      schema:
        items:
          type: integer
        type: array
    flags:
      allowReserved: true
      description: Various flags about properties of the tour (multiple selection allowed).
      examples:
        oneFlag:
          summary: Filter for private tours only.
          value:
            - private
        multipleFlags:
          summary: Filter for private tours with pick-up only.
          value:
            - private
            - pick-up
      explode: true
      in: query
      name: flags[]
      required: false
      schema:
        items:
          $ref: '#/components/schemas/Flags'
        type: array
    sortfield-2:
      description: |
        Defines the sort field. Behavior per value:
          - `popularity`: returns recommended results (an internal ranking, not raw popularity). `sortdirection` is ignored.
          - `rating`: ranks using internal signals in addition to `overall_rating`; results are not strictly ordered by the `overall_rating` response field alone.
          - `price`: sorts by price.
          - `duration`: sorts by duration.
      in: query
      name: sortfield
      required: false
      schema:
        enum:
          - popularity
          - price
          - rating
          - duration
        type: string
    cnt-language:
      in: query
      name: cnt-language
      required: true
      schema:
        $ref: '#/components/schemas/CntLanguage'
  responses:
    Default:
      description: Other HTTP status codes which do not provide additional information are 403, 405, 429 and 500.
    4XX:
      description: HTTP 400, 401, 404 have the same response format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AvailabilityResponse:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Availability'
    DayBreakdownResponse:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              tour_options:
                type: array
                items:
                  $ref: '#/components/schemas/Option'
  requestBodies:
    DayBreakdownRequestBody:
      description: Request body for day breakdown
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DayBreakdownRequest'
