aid: getyourguide
name: GetYourGuide
description: >-
  GetYourGuide is a Berlin-based online travel marketplace for booking tours,
  activities, attraction tickets, and experiences in destinations around the
  world. Founded in 2009, the company connects travelers with local activity
  suppliers and operators, and exposes a public Partner API that gives affiliates,
  agencies, and technology partners programmatic access to the GetYourGuide
  marketplace catalog — searching tours and activities, retrieving categories,
  options, availability, price breakdowns, supplier details, and reviews, and
  creating shopping carts and bookings. The RESTful Partner API uses JSON,
  is secured over TLS with an API access token (X-ACCESS-TOKEN header), and
  publishes its OpenAPI specification as open source on GitHub. GetYourGuide is
  backed by Battery Ventures and SoftBank Vision Fund.
